# Included by every location that sets its own headers (add_header is not inherited by those).
# The pages carry their own Content-Security-Policy (meta tag with the script hashes); this one adds what a meta tag
# cannot say. HSTS belongs to the server that terminates TLS.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
