packages:
  - apps/*
  - packages/*

# One version of each tool for the whole workspace: packages refer to it with "catalog:".
catalog:
  '@fontsource-variable/nunito-sans': ^5.3.0
  '@fontsource-variable/outfit': ^5.3.0
  '@sveltejs/adapter-static': ^4.0.0
  '@sveltejs/kit': ^3.0.1
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^24.19.1
  openapi-typescript: ^7.13.0
  prettier: ^3.9.9
  prettier-plugin-svelte: ^4.1.1
  svelte: ^5.57.2
  svelte-check: ^4.7.6
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: ^8.3.3
  vitest: ^4.1.11

# openapi-typescript (types generation only) declares TypeScript 5 and works with 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
