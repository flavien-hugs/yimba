name: Publish image to GHCR

on:
  push:
    branches: ["main", "preprod", "develop"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref == 'refs/heads/main' && 'latest') || (github.ref == 'refs/heads/preprod' && 'preprod') || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker registry
        run: echo "${{ secrets.GHRC_PASSWORD }}" | docker login ghcr.io -u ${{ secrets.GHRC_USERNAME }} --password-stdin

      - name: Determine image tag
        id: tag
        run: |
          case "${{ github.ref_name }}" in
            main) echo "name=latest" >> "$GITHUB_OUTPUT" ;;
            preprod) echo "name=preprod" >> "$GITHUB_OUTPUT" ;;
            develop) echo "name=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push
        run: |
          docker build -t ${{ secrets.GHRC_REGISTRY_ADDR }}:${{ steps.tag.outputs.name }} .
          docker push ${{ secrets.GHRC_REGISTRY_ADDR }}:${{ steps.tag.outputs.name }}
