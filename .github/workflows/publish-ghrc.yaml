name: Publish backend image to GHCR

# Publishes only what the backend CI validated: runs after it succeeds on a push to main, preprod or develop.
on:
  workflow_run:
    workflows: ["Backend"]
    types: [completed]
    branches: ["main", "preprod", "develop"]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.workflow_run.head_branch == 'main' && 'latest') || (github.event.workflow_run.head_branch == 'preprod' && 'preprod') || 'dev' }}
    strategy:
      matrix:
        include:
          - variant: ""
            extras: ""
          # Worker image with transformers (torch CPU) and the MLflow client.
          - variant: "-ml"
            extras: "ml tracking"
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine image tag
        id: tag
        run: |
          case "${{ github.event.workflow_run.head_branch }}" in
            main) echo "name=latest" ;;
            preprod) echo "name=preprod" ;;
            *) echo "name=dev" ;;
          esac >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHRC_USERNAME }}
          password: ${{ secrets.GHRC_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: EXTRAS=${{ matrix.extras }}
          # A moving tag per branch, and an immutable one per commit for rollbacks.
          tags: |
            ${{ secrets.GHRC_REGISTRY_ADDR }}:${{ steps.tag.outputs.name }}${{ matrix.variant }}
            ${{ secrets.GHRC_REGISTRY_ADDR }}:${{ github.event.workflow_run.head_sha }}${{ matrix.variant }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=image${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.variant }}
