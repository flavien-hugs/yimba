name: Frontend

# Checks, builds and publishes the frontend: one image per app (user app, administration), each with its own
# Dockerfile (frontend/infra/<app>/Dockerfile).
# Runs when the frontend changes, and on every git tag: check and image, then the images are published to GHCR, only
# if both succeeded. The tags depend on the ref:
#   main -> latest, develop -> dev, preprod -> preprod, tag v1.2.0 -> v1.2.0 (plus the commit sha, for rollbacks);
#   a pull request is published under its commit sha only,
# for yimba-frontend-user and yimba-frontend-admin.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"
  push:
    branches: ["main", "preprod", "develop"]
    # Path filters do not apply to tags: every tag builds its image.
    tags: ["*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"

# A new push to a pull request cancels its previous run; runs on branches always finish (they may be publishing).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Image name without the app, by default under the repository owner; the repository variable FRONTEND_IMAGE overrides
  # it. The images are <name>-user and <name>-admin.
  IMAGE: ${{ vars.FRONTEND_IMAGE || format('ghcr.io/{0}/yimba-frontend', github.repository_owner) }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pnpm at the version of "packageManager" in frontend/package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm lint

      - name: Types
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user
            page: /
            marker: _app/immutable
          - app: admin
            page: /admin/connexion
            marker: /admin/_app/immutable
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not pushed; the publish job reuses its cache)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/infra/${{ matrix.app }}/Dockerfile
          load: true
          tags: yimba-frontend-${{ matrix.app }}:ci
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }}

      - name: Smoke test
        working-directory: .
        run: |
          docker run -d --name frontend -p 8080:8080 -e API_UPSTREAM=127.0.0.1:9 yimba-frontend-${{ matrix.app }}:ci
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS "http://localhost:8080${{ matrix.page }}" | grep -c 'content-security-policy' > /dev/null
          curl -fsS "http://localhost:8080${{ matrix.page }}" | grep -c '${{ matrix.marker }}' > /dev/null
          docker rm -f frontend

  publish:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN when no GHRC_PASSWORD secret is set
    strategy:
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}-${{ matrix.app }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}
            type=ref,event=tag
            type=sha,format=long,prefix=

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Defaults: the repository owner and the workflow token; GHRC_USERNAME / GHRC_PASSWORD secrets override them.
          username: ${{ secrets.GHRC_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHRC_PASSWORD || secrets.GITHUB_TOKEN }}

      # Reuses the layers the "image" job just built (same cache scope).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/infra/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }}
