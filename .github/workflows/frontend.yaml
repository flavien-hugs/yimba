name: Frontend

# Checks, builds and publishes the frontend (user app and admin app, one nginx image). Runs when the frontend changes,
# and on every git tag. On pull requests: check and image. On a push to main, preprod or develop, or a tag: the same,
# then the image is published to GHCR, only if both succeeded:
#   main -> latest, develop -> dev, preprod -> preprod, tag v1.2.0 -> v1.2.0 (plus the commit sha, for rollbacks).
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"
  push:
    branches: ["main", "preprod", "develop"]
    # Path filters do not apply to tags: every tag builds its image.
    tags: ["*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"

# A new push to a pull request cancels its previous run; runs on branches always finish (they may be publishing).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Image name, by default under the repository owner; the repository variable FRONTEND_IMAGE overrides it.
  IMAGE: ${{ vars.FRONTEND_IMAGE || format('ghcr.io/{0}/yimba-frontend', github.repository_owner) }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pnpm at the version of "packageManager" in frontend/package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm lint

      - name: Types
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not pushed; the publish job reuses its cache)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: yimba-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test
        working-directory: .
        run: |
          docker run -d --name frontend -p 8080:8080 -e API_UPSTREAM=127.0.0.1:9 yimba-frontend:ci
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -c 'content-security-policy' > /dev/null
          curl -fsS http://localhost:8080/paroles | grep -c '_app/immutable' > /dev/null
          curl -fsS http://localhost:8080/admin/connexion | grep -c '/admin/_app/immutable' > /dev/null
          docker rm -f frontend

  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN when no GHRC_PASSWORD secret is set
    steps:
      - uses: actions/checkout@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=preprod,enable=${{ github.ref == 'refs/heads/preprod' }}
            type=ref,event=tag
            type=sha,format=long,prefix=

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Defaults: the repository owner and the workflow token; GHRC_USERNAME / GHRC_PASSWORD secrets override them.
          username: ${{ secrets.GHRC_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHRC_PASSWORD || secrets.GITHUB_TOKEN }}

      # Reuses the layers the "image" job just built (same cache scope).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
