name: Backend

# Checks, builds and publishes the backend. Runs when the backend, the analytics (they read its schema) or the stack
# definition change. On pull requests: check and image. On a push to main, preprod or develop: the same, then the
# image is published to GHCR, only if both succeeded.
on:
  pull_request:
    paths:
      - "backend/**"
      - "analytics/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend.yaml"
  push:
    branches: ["main", "preprod", "develop"]
    paths:
      - "backend/**"
      - "analytics/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend.yaml"

# A new push to a pull request cancels its previous run; runs on branches always finish (they may be publishing).
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yimba_test
          POSTGRES_USER: yimba
          POSTGRES_PASSWORD: yimba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yimba -d yimba_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install "poetry==2.3.4"

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Format and lint
        run: |
          poetry run black --check yimba tests migrations
          poetry run isort --check yimba tests migrations
          poetry run flake8 yimba tests migrations/env.py
          poetry run black --config pyproject.toml --check ../analytics
          poetry run isort --settings-path . --check ../analytics
          poetry run flake8 --config .flake8 ../analytics

      - name: Architecture rules
        run: poetry run lint-imports

      - name: Tests (SQLite)
        run: poetry run pytest -q

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://yimba:yimba@localhost:5432/yimba_test
        run: poetry run pytest -q

      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://yimba:yimba@localhost:5432/yimba_test
        run: |
          poetry run alembic downgrade base || true
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Analytics (dbt build on the migrated schema, Pandera checks)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: yimba_test
          POSTGRES_USER: yimba
          POSTGRES_PASSWORD: yimba
        working-directory: analytics
        run: |
          python -m venv /tmp/analytics && . /tmp/analytics/bin/activate
          pip install -r requirements.txt pytest
          pytest -q
          dbt build --project-dir dbt --profiles-dir dbt
          python -m quality

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not pushed; the publish job reuses its cache)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: yimba-backend:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Smoke test
        run: |
          docker run --rm yimba-backend:ci --help
          docker run --rm --entrypoint python yimba-backend:ci -c "import yimba.entrypoints.api.app, yimba.entrypoints.worker.app"

  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref_name == 'main' && 'latest') || (github.ref_name == 'preprod' && 'preprod') || 'dev' }}
    strategy:
      matrix:
        include:
          - variant: ""
            extras: ""
          # Worker image with transformers (torch CPU) and the MLflow client.
          - variant: "-ml"
            extras: "ml tracking"
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          case "${{ github.ref_name }}" in
            main) echo "name=latest" ;;
            preprod) echo "name=preprod" ;;
            *) echo "name=dev" ;;
          esac >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHRC_USERNAME }}
          password: ${{ secrets.GHRC_PASSWORD }}

      # The base variant reuses the layers the "image" job just built (same cache scope).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: EXTRAS=${{ matrix.extras }}
          # A moving tag per branch, and an immutable one per commit for rollbacks.
          tags: |
            ${{ secrets.GHRC_REGISTRY_ADDR }}:${{ steps.tag.outputs.name }}${{ matrix.variant }}
            ${{ secrets.GHRC_REGISTRY_ADDR }}:${{ github.sha }}${{ matrix.variant }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.variant }}
