name: Backend

# Runs when the backend, the analytics (they read its schema) or the stack definition change.
on:
  pull_request:
    paths:
      - "backend/**"
      - "analytics/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend.yaml"
  push:
    branches: ["main", "preprod", "develop"]
    paths:
      - "backend/**"
      - "analytics/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend.yaml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yimba_test
          POSTGRES_USER: yimba
          POSTGRES_PASSWORD: yimba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yimba -d yimba_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install "poetry==2.3.4"

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Format and lint
        run: |
          poetry run black --check src tests migrations
          poetry run isort --check src tests migrations
          poetry run flake8 src tests migrations/env.py
          poetry run black --config pyproject.toml --check ../analytics
          poetry run isort --settings-path . --check ../analytics
          poetry run flake8 --config .flake8 ../analytics

      - name: Architecture rules
        run: poetry run lint-imports

      - name: Tests (SQLite)
        run: poetry run pytest -q

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://yimba:yimba@localhost:5432/yimba_test
        run: poetry run pytest -q

      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://yimba:yimba@localhost:5432/yimba_test
        run: |
          poetry run alembic downgrade base || true
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Analytics (dbt build on the migrated schema, Pandera checks)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: yimba_test
          POSTGRES_USER: yimba
          POSTGRES_PASSWORD: yimba
        working-directory: analytics
        run: |
          python -m venv /tmp/analytics && . /tmp/analytics/bin/activate
          pip install -r requirements.txt pytest
          pytest -q
          dbt build --project-dir dbt --profiles-dir dbt
          python -m quality

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not pushed; the cache is reused by the publish workflow)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: yimba-api:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Smoke test
        run: |
          docker run --rm yimba-api:ci --help
          docker run --rm --entrypoint python yimba-api:ci -c "import yimba.entrypoints.api.app, yimba.entrypoints.worker.app"
