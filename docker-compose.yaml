x-app: &app
    build: .
    image: "ghcr.io/flavien-hugs/yimba-api:${IMAGE_VERSION:-dev}"
    restart: unless-stopped
    env_file:
        - .env
    environment:
        DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
        REDIS_URL: "redis://redis:6379/0"
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    migrate:
        <<: *app
        restart: "no"
        command: ["db-upgrade"]

    api:
        <<: *app
        command: ["api"]
        ports:
            - "${APP_PORT:-8800}:8800"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8800/@ping')"]
            interval: 10s
            timeout: 3s
            retries: 5

    worker:
        <<: *app
        command: ["worker", "--concurrency", "2"]

    beat:
        <<: *app
        command: ["beat"]

    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_USER: "${POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        volumes:
            - yimba_pg:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    yimba_pg:
